<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kora ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="card login-card">
    <div class="brand big"><span class="logo">K</span>Kora ERP</div>
    <p class="muted">Stock, sales, purchasing and invoicing for a growing business.</p>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" class="err" role="alert"></p>
    <button class="btn primary wide" type="submit">Sign in</button>
    <div class="demo">
      <p class="muted small">Demo accounts (password <code>Demo#12345</code>):</p>
      <div class="chips">
        <button type="button" data-demo="admin">Admin</button><button type="button" data-demo="sales">Sales</button>
        <button type="button" data-demo="warehouse">Warehouse</button><button type="button" data-demo="accounts">Accounts</button>
      </div>
    </div>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <div class="brand"><span class="logo">K</span>Kora ERP</div>
    <nav id="nav"></nav>
    <div class="who"><b id="whoName"></b><span id="whoRole" class="pill"></span><button id="logout" class="link">Sign out</button></div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<dialog id="dlg"><form id="dlgForm" method="dialog" class="dlg"></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
